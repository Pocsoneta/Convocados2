<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del partido · Convocados</title>
  <meta name="theme-color" content="#060b14">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/detalle-partido.css">
</head>
<body>

  <div class="app">

    <!-- ============ Barra lateral (se repite en las pantallas internas) ============ -->
    <aside class="sidebar">

      <a class="brand" href="inicio.html" aria-label="Convocados, inicio">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>
          </svg>
        </span>
        <span class="brand__name">Convoca<span>dos</span></span>
      </a>

      <nav class="sidebar__nav" aria-label="Principal">
        <a class="nav-link" href="inicio.html">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/>
          </svg>
          <span>Inicio</span>
        </a>
        <a class="nav-link is-active" href="buscar.html" aria-current="page">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
          </svg>
          <span>Buscar</span>
        </a>
        <a class="nav-link" href="crear-partido.html">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
          <span>Crear partido</span>
        </a>
        <a class="nav-link" href="mis-partidos.html">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="5" width="16" height="15" rx="3"/>
            <path d="M4 10h16M8 3v4M16 3v4"/>
          </svg>
          <span>Mis partidos</span>
        </a>
        <a class="nav-link" href="perfil-deportivo.html">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 20.5c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>
          </svg>
          <span>Perfil</span>
        </a>
      </nav>

      <div class="sidebar__user">
        <a class="user" href="perfil-deportivo.html" aria-label="Ver y editar mi perfil">
          <span class="user__avatar" id="user-avatar">
            <img id="user-foto" alt="" hidden>
            <span id="user-iniciales" aria-hidden="true"></span>
          </span>
          <span class="user__info">
            <strong id="user-nombre">Mi cuenta</strong>
            <span id="user-localidad"></span>
          </span>
        </a>
        <button class="user__logout" type="button" id="btn-logout" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4"/>
            <path d="m16 17 5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </div>

    </aside>

    <!-- ============ Contenido ============ -->
    <main class="app__main">
      <div class="detalle" id="detalle" aria-busy="false">

        <header class="page-head">
          <div>
            <h1 class="page-head__title">Detalle del partido</h1>
            <p class="page-head__lead">Toda la info antes de sumarte.</p>
          </div>
          <a class="btn btn--ghost" href="buscar.html">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5M11 6l-6 6 6 6"/>
            </svg>
            Volver a resultados
          </a>
        </header>

        <div class="detalle__grid">

          <!-- Información del partido -->
          <section class="info" aria-labelledby="nombre">

            <div class="ubicacion">
              <p class="ubicacion__label">Ubicación</p>
              <p class="ubicacion__direccion" id="ubicacion-direccion"></p>
              <a class="btn btn--outline" id="btn-mapa" href="#" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/>
                  <circle cx="12" cy="10" r="2.3"/>
                </svg>
                Abrir ubicación
              </a>
            </div>

            <div class="cabecera">
              <span class="badge" id="modalidad"></span>
              <h2 class="cabecera__nombre" id="nombre"></h2>
              <p class="cabecera__lugar">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/>
                  <circle cx="12" cy="10" r="2.3"/>
                </svg>
                <span id="lugar"></span>
              </p>
            </div>

            <ul class="datos">
              <li class="dato">
                <span class="dato__label">Fecha</span>
                <strong class="dato__valor" id="fecha"></strong>
              </li>
              <li class="dato">
                <span class="dato__label">Horario</span>
                <strong class="dato__valor" id="horario"></strong>
              </li>
              <li class="dato">
                <span class="dato__label">Precio de la cancha</span>
                <strong class="dato__valor dato__valor--accent" id="precio"></strong>
              </li>
            </ul>

            <section class="descripcion" id="bloque-descripcion" hidden>
              <h3 class="descripcion__titulo">Sobre el partido</h3>
              <p class="descripcion__texto" id="descripcion"></p>
            </section>

          </section>

          <!-- Organizador y jugadores -->
          <aside class="panel" aria-labelledby="titulo-jugadores">

            <div class="organizador">
              <span class="persona__avatar" id="org-avatar"></span>
              <div class="organizador__texto">
                <span class="organizador__label">Organizador</span>
                <strong class="organizador__nombre" id="org-nombre"></strong>
              </div>
            </div>

            <div class="panel__head">
              <h2 class="panel__title" id="titulo-jugadores">Jugadores confirmados</h2>
              <span class="contador" id="contador"></span>
            </div>

            <ul class="jugadores" id="jugadores" aria-live="polite"></ul>

            <div class="accion">
              <p class="accion__titulo" id="nota-titulo"></p>
              <p class="accion__texto" id="nota-texto"></p>
              <button class="btn btn--main" type="button" id="btn-accion" disabled></button>
              <p class="error" id="error" role="alert"></p>
            </div>

          </aside>

        </div>
      </div>
    </main>

  </div>

  <script src="js/core.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/detalle-partido.js"></script>
</body>
</html>
